# Standing command approvals for this repository (ADR 17): argv prefixes
# that may run without a confirm. The guard logs each use. Deny rules still
# apply; only the confirm is waived. Read-only and test commands only —
# nothing here writes to the tree, commits, or reaches the network.
commands = [
  "go test",
  "go build",
  "go vet",
  "gofmt -l",
  "staticcheck",
  "make lint",
  "make test",
  "make exfil",
  "make accept",
  "make validate",
  "make build",
  "git status",
  "git diff",
  "git log",
  "git grep",
  "git ls-files",
]

# Standing write approvals: repository-relative prefixes the model may
# write under without a prompt. The diff is logged and shown dimmed instead.
# .nodwyn/, .github/, scripts/ and Makefile can never be listed here (guard
# Protected). Review with git diff before committing; git is the undo.
writes = [
  "internal/",
  "docs/",
  "test/",
  "dev/",
  "cmd/",
]
