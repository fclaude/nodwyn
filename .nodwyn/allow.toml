# Standing command approvals for this repository (ADR 17): argv prefixes
# that may run without an ordinary confirm when their arguments pass the
# guard's flag and path checks. Denies and security confirms still apply;
# each use is logged. Builds and tests execute project code, write outputs
# and caches, and may use the network. These approvals are not a sandbox.
commands = [
  "go test",
  "go build",
  "go vet",
  "gofmt -l",
  "staticcheck",
  "make lint",
  "make test",
  "make exfil",
  "make accept",
  "make validate",
  "make build",
  "git status",
  "git diff",
  "git log",
  "git grep",
  "git ls-files",
]

# Standing write approvals: repository-relative prefixes the model may
# write under without a prompt. The diff is logged and shown dimmed instead.
# .nodwyn/, .git/, .github/, .gitea/, scripts/ and Makefile can never be
# approved here (guard Protected). Review with git diff before committing;
# git is the undo.
writes = [
  "internal/",
  "docs/",
  "test/",
  "dev/",
  "cmd/",
]
