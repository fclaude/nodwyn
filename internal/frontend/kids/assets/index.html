<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My projects</title><link rel="stylesheet" href="/kids.css"><script type="module" src="/kids.js"></script></head><body><header><h1>My projects</h1><p>Imagine something. Make it yours.</p></header><main><p id="error" role="alert"></p><section id="login" hidden><h2>Welcome</h2><p>Ask a parent to connect this browser.</p><form id="pair"><label>Invitation <input id="invite" required autocomplete="off"></label><label>Browser name <input id="device" required placeholder="laptop1-child" pattern="[a-z0-9][a-z0-9._-]{0,31}"></label><button>Connect</button><button type="button" id="register">Parent: register passkey</button><button type="button" id="signin">Parent: use passkey</button></form></section><section id="workspace" hidden><form id="create"><label>New project <input id="name" required pattern="[a-z][a-z0-9-]{0,31}" placeholder="my-space-game" maxlength="32"></label><button>Create</button></form><nav id="projects" aria-label="Projects"></nav><section id="project" hidden><div class="actions"><h2 id="title"></h2><a id="preview" target="_blank" rel="noopener noreferrer">See app</a><a id="public" target="_blank" rel="noopener noreferrer">Your website</a><button id="rename">Rename</button><button id="delete">Delete</button></div><p id="status" role="status"></p><div id="messages" aria-live="polite"></div><form id="chat"><label>What would you like to make or change?<textarea id="text" required maxlength="8000" rows="3"></textarea></label><button id="send">Send</button><button type="button" id="stop">Stop</button></form></section><section id="parent" hidden><h2>Parent controls</h2><button id="touch">Confirm with passkey</button><button id="invite-child">Invite child browser</button><button id="devices">List devices</button><label>Device to revoke <input id="revoke-name"></label><button id="revoke">Revoke device</button><pre id="parent-result"></pre></section></section></main></body></html>
