<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#171613" />
    <title>nodwyn</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="gate" class="gate">
      <div class="gate-card"><div class="brand">nodwyn<span>.</span></div><p>Connecting…</p></div>
    </div>
    <div id="shell" class="shell" hidden>
      <div class="topbar">
        <button id="menu" type="button" class="icon-btn" aria-label="Open the task list"></button>
        <div class="brand">nodwyn<span>.</span></div>
        <a id="topbar-count" class="pill warn" href="#/" hidden></a>
      </div>
      <nav id="sidebar" class="sidebar" aria-label="nodwyn"></nav>
      <div class="content">
        <div id="offline" class="banner" role="status" hidden>
          Disconnected. Nothing was retried.
          <button id="reconnect" type="button" class="btn small">Reconnect</button>
        </div>
        <div id="view" class="view"></div>
      </div>
    </div>
  </body>
</html>
