name: pages

# The website (site/) is built from the guide in site/content and from the docs.
# A pull request builds it, which fails on a broken link; a push to main also
# publishes it. Pages has to be set to "GitHub Actions" in the repository's settings.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - SPEC.md
      - plan.md
      - internal/frontend/web/assets/fonts/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - docs/**
      - SPEC.md
      - plan.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r site/requirements.txt
      - name: Build the site and check its links
        run: python3 site/build.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/_out

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
