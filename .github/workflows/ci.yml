# Optional GitHub mirror. The primary Gitea workflow is .gitea/workflows/ci.yml.
# GitHub is manual-only while builds and releases run on Gitea (ADR 42).
name: ci

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, linux, x64, nodwyn]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The newest patch of go.mod's base release (ADR 33); go-version-file
          # would install go.mod's 1.26.0 itself.
          go-version: '1.26.x'
          # The runner keeps its Go module cache between jobs, and its
          # unprivileged user cannot restore an archive over read-only modules.
          cache: false
      - name: govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: lint
        run: make lint
      - name: test
        run: make test
      - name: exfil
        run: make exfil
      - name: govulncheck
        run: govulncheck ./...
