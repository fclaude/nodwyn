name: release

# A release is a manual run on main with a version such as v0.1.0. Pushes never
# publish (ADR 42).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  # The macOS app needs cgo and the macOS SDK, so a Mac builds it. Its
  # executable reports the source commit, as the portable archives do, and
  # Finder shows the release's number; the script runs this Mac's slice.
  app:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: Build Nodwyn.app from the source commit
        run: scripts/app-macos.sh "$GITHUB_SHA" "${RELEASE_VERSION#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodwyn-macos-app
          path: bin/Nodwyn-macos-universal.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [check, app]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: nodwyn-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: Install the TeX packages both books use
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk lmodern texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nodwyn-macos-app
          path: ${{ runner.temp }}/nodwyn-app
      - name: Build binaries and books from the source commit
        run: |
          release_dir=$(mktemp -d "$RUNNER_TEMP/nodwyn-release.XXXXXX")
          # The build takes the app only if it was built from this commit as this version.
          python3 scripts/release.py build "$release_dir" --version "$RELEASE_VERSION" \
            --app "$RUNNER_TEMP/nodwyn-app/Nodwyn-macos-universal.zip"
          printf 'RELEASE_DIRECTORY=%s\n' "$release_dir" >> "$GITHUB_ENV"
      - name: Upload to a draft, check it as downloaded, then publish
        run: |
          # A version is bound to one commit: refuse a release or a tag that exists.
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "release $RELEASE_VERSION already exists (a draft left by a failed run counts)" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "tag $RELEASE_VERSION already exists" >&2
            exit 1
          fi
          # From here a failure may leave a draft of this run's making.
          echo "RELEASE_CREATED=1" >> "$GITHUB_ENV"
          gh release create "$RELEASE_VERSION" "$RELEASE_DIRECTORY"/* \
            --draft --target "$GITHUB_SHA" --title "nodwyn $RELEASE_VERSION" \
            --notes "Source commit: \`$GITHUB_SHA\`

          The macOS app (Nodwyn-macos-universal.zip): Apple silicon and Intel in one bundle, with its own window and icon, built and started on a macOS runner; it is signed ad hoc, not notarised, so macOS refuses the first launch until Open Anyway is clicked in System Settings → Privacy & Security. Portable Linux and macOS binaries for amd64 and arm64, both books rebuilt from this source, and SHA-256 checksums. Acceptance checks and the Linux amd64 fake-model selfcheck passed; the other portable targets are cross-compiled, not executed. The portable builds omit the native webview, so their \`nodwyn app\` opens a browser. Each archive includes a Linux nodwyn-egress for its architecture, for MCP containers."
          downloaded=$(mktemp -d "$RUNNER_TEMP/nodwyn-downloaded.XXXXXX")
          gh release download "$RELEASE_VERSION" --dir "$downloaded"
          python3 scripts/release.py verify "$downloaded" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
          gh release edit "$RELEASE_VERSION" --draft=false
      - name: Remove the draft this run left behind
        if: failure() && env.RELEASE_CREATED == '1'
        run: |
          # Only a draft made by this run: a published release is never touched.
          if [ "$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft)" = true ]; then
            gh release delete "$RELEASE_VERSION" --yes
          fi
