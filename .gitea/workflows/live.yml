name: Live model checks

# The live suite (test/live, ADR 63) runs nodwyn built from main against a
# real model endpoint, nightly and by hand. It runs on this Gitea's runner
# only: GitHub reads .github/workflows, never this directory.
#
# The endpoint is the repository's settings, never a file in it:
#   secrets  NODWYN_LIVE_URL  the endpoint's address, with its version path
#            NODWYN_LIVE_KEY  its key; leave it unset for a keyless server
#   vars     NODWYN_LIVE_PROVIDER  ollama, openai or anthropic
#            NODWYN_LIVE_MODEL     the model the scenarios ask
#            NODWYN_LIVE_DIALECT   optional: a chat-completions dialect, or responses
#            NODWYN_LIVE_NUM_CTX   optional: the context to ask an Ollama model for
# Gitea masks the secrets in the job's log, and the suite itself prints and
# keeps them only as [live url], [live host] and [live key]: nodwyn talks to
# a proxy on 127.0.0.1 and never sees the address.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitea-live
  cancel-in-progress: false

jobs:
  live:
    if: ${{ vars.NODWYN_LIVE_PROVIDER != '' && vars.NODWYN_LIVE_MODEL != '' }}
    runs-on: ${{ vars.NODWYN_LINUX_RUNNER || 'linux-alpine' }}
    timeout-minutes: 150
    env:
      GOMEMLIMIT: 1GiB
      TAR_OPTIONS: --no-same-owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Live scenarios
        env:
          NODWYN_LIVE_PROVIDER: ${{ vars.NODWYN_LIVE_PROVIDER }}
          NODWYN_LIVE_MODEL: ${{ vars.NODWYN_LIVE_MODEL }}
          NODWYN_LIVE_DIALECT: ${{ vars.NODWYN_LIVE_DIALECT }}
          NODWYN_LIVE_NUM_CTX: ${{ vars.NODWYN_LIVE_NUM_CTX }}
          NODWYN_LIVE_URL: ${{ secrets.NODWYN_LIVE_URL }}
          NODWYN_LIVE_KEY: ${{ secrets.NODWYN_LIVE_KEY }}
          NODWYN_LIVE_REPORT: ${{ runner.temp }}/nodwyn-live-report
        run: make live
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
        with:
          name: nodwyn-live-report
          path: ${{ runner.temp }}/nodwyn-live-report
          if-no-files-found: ignore
          retention-days: 30
