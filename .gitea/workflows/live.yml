name: Live model checks

# The live suite (test/live, ADR 63) runs nodwyn built from main against a
# real model endpoint, on this Gitea's runner only: GitHub reads
# .github/workflows, never this directory. live-weekly.yml runs it
# on the release mornings and releases what passed.
#
# On the other mornings, it runs the extended tier when main has a commit from the last day,
# and skips otherwise: no new commit, nothing new to test. By hand, it runs
# the tier chosen.
#
# The endpoint is the repository's settings, never a file in it:
#   secrets  NODWYN_LIVE_URL  the endpoint's address, with its version path
#            NODWYN_LIVE_KEY  its key; leave it unset for a keyless server
#   vars     NODWYN_LIVE_PROVIDER  ollama, openai or anthropic
#            NODWYN_LIVE_MODELS    the models the scenarios ask, one run each, one
#                                  after the other: name or name@context (the
#                                  context to ask an Ollama model for), spaces
#                                  between (scripts/live-models.sh)
#            NODWYN_LIVE_DIALECT   optional: a chat-completions dialect, or responses
# Gitea masks the secrets in the job's log, and the suite itself prints and
# keeps them only as [live url], [live host], [live address] and [live key]:
# nodwyn talks to a proxy on 127.0.0.1 and never sees the address.
on:
  schedule:
    # 04:55 in California, on the mornings live-weekly.yml does not
    # run: off-peak for the endpoint. A run takes about 33 minutes for both
    # models (Gitea run 40548). Gitea reads the TZ= prefix.
    - cron: "TZ=America/Los_Angeles 55 4 * * 3,4,6"
  workflow_dispatch:
    inputs:
      tier:
        description: core (the quick nine) or extended (every scenario)
        default: extended
        type: choice
        options: [extended, core]

permissions:
  contents: read

concurrency:
  group: gitea-live
  cancel-in-progress: false

jobs:
  live:
    if: ${{ vars.NODWYN_LIVE_PROVIDER != '' && vars.NODWYN_LIVE_MODELS != '' }}
    runs-on: ${{ vars.NODWYN_LINUX_RUNNER || 'linux-alpine' }}
    timeout-minutes: 240
    env:
      GOMEMLIMIT: 1GiB
      TAR_OPTIONS: --no-same-owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Anything new to test
        id: gate
        # A scheduled run tests main only when a commit came in since the
        # morning before; a run by hand always tests.
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          committed=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - committed )) -lt 86400 ]; then
            echo "main has a commit from the last day: testing it"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "no commit on main since the last morning's run: nothing new to test"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Can this job reach the endpoint
        if: steps.gate.outputs.run == 'true'
        env:
          NODWYN_LIVE_URL: ${{ secrets.NODWYN_LIVE_URL }}
        run: bash scripts/live-reach.sh
      - name: Live scenarios
        if: steps.gate.outputs.run == 'true'
        env:
          NODWYN_LIVE_TIER: ${{ inputs.tier || 'extended' }}
          NODWYN_LIVE_PROVIDER: ${{ vars.NODWYN_LIVE_PROVIDER }}
          NODWYN_LIVE_MODELS: ${{ vars.NODWYN_LIVE_MODELS }}
          NODWYN_LIVE_DIALECT: ${{ vars.NODWYN_LIVE_DIALECT }}
          NODWYN_LIVE_URL: ${{ secrets.NODWYN_LIVE_URL }}
          NODWYN_LIVE_KEY: ${{ secrets.NODWYN_LIVE_KEY }}
          NODWYN_LIVE_REPORT: ${{ runner.temp }}/nodwyn-live-report
        run: bash scripts/live-models.sh
      - name: Show the report
        # go test prints the suite's own output only when it fails; the
        # report says what each scenario did either way.
        if: always() && steps.gate.outputs.run == 'true'
        run: cat "$RUNNER_TEMP"/nodwyn-live-report/*/report.md 2>/dev/null || echo "no report was written"
      - name: Keep the report
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@c6a366c94c3e0affe28c06c8df20a878f24da3cf # v3.2.2
        with:
          name: nodwyn-live-report
          path: ${{ runner.temp }}/nodwyn-live-report
          if-no-files-found: ignore
          retention-days: 30
