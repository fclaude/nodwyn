name: Tests, portable builds and releases

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
      # Tool archives contain build-machine owners; keep the runner's owner.
      TAR_OPTIONS: --no-same-owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare runner tools
        run: |
          mkdir -p "$GOTMPDIR" "$TMPDIR" "$RUNNER_TEMP"
          # The runner permits public HTTPS; Alpine's default mirrors may use HTTP.
          sed 's|http://|https://|g' /etc/apk/repositories > "$RUNNER_TEMP/apk-repositories"
          apk --repositories-file "$RUNNER_TEMP/apk-repositories" add --no-cache python3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The newest patch of go.mod's base release (ADR 33); go-version-file
          # would install go.mod's 1.26.0 itself.
          go-version: '1.26.x'
          # Host jobs reuse local Go caches. Archive restore cannot overwrite
          # read-only module files with the runner's dropped capabilities.
          cache: false
      - name: Install analyzer
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - name: Acceptance checks
        run: make accept GO_TEST_FLAGS=-count=1
      - name: Release publisher checks
        run: python3 -B -m unittest discover -s test/release -v
      - name: Cross-compile release targets
        run: |
          mkdir -p "$RUNNER_TEMP/nodwyn-builds"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            echo "Building $os/$arch without cgo"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -o "$RUNNER_TEMP/nodwyn-builds/nodwyn-$os-$arch" ./cmd/nodwyn
          done
          "$RUNNER_TEMP/nodwyn-builds/nodwyn-linux-amd64" version
          test "$("$RUNNER_TEMP/nodwyn-builds/nodwyn-linux-amd64" eval -e '(+ 1 2)')" = 3
      - name: Check source stayed clean
        run: git diff --exit-code

  release:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1GiB
      TAR_OPTIONS: --no-same-owner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare release tools
        run: |
          mkdir -p "$GOTMPDIR" "$TMPDIR" "$RUNNER_TEMP"
          sed 's|http://|https://|g' /etc/apk/repositories > "$RUNNER_TEMP/apk-repositories"
          apk --repositories-file "$RUNNER_TEMP/apk-repositories" add --no-cache \
            python3 bash make latexmk texlive texmf-dist-latexextra \
            texmf-dist-fontsrecommended texmf-dist-fontsextra
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build binaries and books from the source commit
        run: |
          release_dir=$(mktemp -d "$RUNNER_TEMP/nodwyn-release.XXXXXX")
          python3 scripts/release.py build "$release_dir"
          printf 'RELEASE_DIRECTORY=%s\n' "$release_dir" >> "$GITHUB_ENV"
      - name: Publish verified release
        env:
          GITEA_URL: ${{ gitea.server_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_COMMIT: ${{ gitea.sha }}
        run: python3 scripts/release.py publish "$RELEASE_DIRECTORY"
